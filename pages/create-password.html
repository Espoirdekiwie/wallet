<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Password — EtherVault</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
                <i class="bi bi-hexagon-fill text-gradient fs-4"></i>
                <span class="brand-name">Ether<span class="text-gradient">Vault</span></span>
            </a>
            <a href="../index.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-house-door me-1"></i>Home
            </a>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="col-lg-5 col-md-8">
            <div class="card shimmer fade-in">
                <div class="card-body p-4 p-md-5">
                    <!-- Step header -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="step-indicator">
                            <div class="step-badge">1</div>
                            <span>Create Password</span>
                        </div>
                        <span class="badge badge-violet font-mono">Step 1 / 4</span>
                    </div>

                    <!-- Progress -->
                    <div class="progress mb-4" style="height: 4px;">
                        <div class="progress-bar" style="width: 25%"></div>
                    </div>

                    <h2 class="fw-bold mb-1">Secure Your Wallet</h2>
                    <p class="text-muted small mb-4">This password protects your wallet during this session.</p>

                    <form id="passwordForm">
                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock-fill me-1" style="color: var(--primary-light)"></i>New Password
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password" placeholder="Min. 8 characters" minlength="8" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="bi bi-eye-fill"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Strength bar -->
                        <div class="mb-4">
                            <div class="progress" style="height: 5px;">
                                <div id="strengthBar" class="progress-bar" style="width: 0%; transition: width 0.4s ease, background 0.4s ease;"></div>
                            </div>
                            <div id="strengthLabel" class="small mt-1" style="color: var(--text-dim);">Enter a password...</div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">
                                <i class="bi bi-lock-fill me-1" style="color: var(--cyan)"></i>Confirm Password
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" minlength="8" required>
                                <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                                    <i class="bi bi-eye-fill"></i>
                                </button>
                            </div>
                            <div id="passwordMatch" class="small mt-1 d-none" style="color: var(--danger);">
                                <i class="bi bi-exclamation-circle me-1"></i>Passwords do not match
                            </div>
                        </div>

                        <!-- Acknowledge -->
                        <div class="glass-panel mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="acknowledgement" required>
                                <label class="form-check-label" for="acknowledgement">
                                    <i class="bi bi-exclamation-triangle-fill me-1" style="color: var(--warning)"></i>
                                    I understand that if I forget this password it <strong>cannot recover</strong> my wallet.
                                </label>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg" id="nextBtn" disabled>
                                Next Step <i class="bi bi-arrow-right ms-1"></i>
                            </button>
                            <a href="../index.html" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/password.js"></script>
</body>
</html>
