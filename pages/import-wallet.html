<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Wallet — EtherVault</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
                <i class="bi bi-hexagon-fill text-gradient fs-4"></i>
                <span class="brand-name">Ether<span class="text-gradient">Vault</span></span>
            </a>
            <a href="../index.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-house-door me-1"></i>Home
            </a>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="col-lg-5 col-md-8">
            <div class="card shimmer fade-in">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 rounded-circle mb-3" style="background: var(--glass-cyan); border: 1px solid var(--glass-border-cyan);">
                            <i class="bi bi-download" style="font-size: 2rem; color: var(--cyan-light);"></i>
                        </div>
                        <h2 class="fw-bold mb-1">Import Wallet</h2>
                        <p class="text-muted small">Restore your wallet using your 12-word secret recovery phrase.</p>
                    </div>

                    <form id="importForm">
                        <!-- Recovery Phrase -->
                        <div class="mb-4">
                            <label for="recoveryPhrase" class="form-label">
                                <i class="bi bi-key-fill me-1" style="color: var(--cyan)"></i>12-Word Recovery Phrase
                            </label>
                            <textarea
                                class="form-control font-mono"
                                id="recoveryPhrase"
                                rows="3"
                                placeholder="word1 word2 word3 ... word12"
                                required
                                style="letter-spacing: 0.05em; line-height: 1.8;"
                            ></textarea>
                            <div class="small mt-1" id="phraseWordCount" style="color: var(--text-dim);">0 / 12 words</div>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock-fill me-1" style="color: var(--primary-light)"></i>Session Password
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password"
                                    placeholder="Create a local session password" minlength="8" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="bi bi-eye-fill"></i>
                                </button>
                            </div>
                            <div class="small mt-1" style="color: var(--text-dim);">Minimum 8 characters</div>
                        </div>

                        <!-- Validation Message -->
                        <div id="validationMessage" class="alert small mb-3" style="display:none;"></div>

                        <!-- Loading -->
                        <div id="loadingState" class="text-center py-2 mb-3" style="display:none;">
                            <div class="spinner-border spinner-violet spinner-border-sm me-2"></div>
                            <span class="text-muted small">Deriving Ethereum keys...</span>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-cyan btn-lg" id="importBtn">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Import Wallet
                            </button>
                            <a href="../index.html" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.min.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/wallet.js"></script>
    <script src="../js/import.js"></script>
</body>
</html>
